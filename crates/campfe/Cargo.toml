[package]
name = "campfe"
description = "A GTK 4 / libadwaita Basecamp client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "campfe"
path = "src/main.rs"

[dependencies]
campfe-core = { path = "../campfe-core" }
tracing.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
gio.workspace = true
glib.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
async-channel = "2"

[build-dependencies]
glib-build-tools = "0.22"

[dev-dependencies]
tempfile = "3"
