[package]
name = "skali-core"
description = "UI-agnostic Basecamp logic for Skali: API client, auth, models, cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
glib.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# The keyring: the Secret Service on the desktop, the Secret portal in a sandbox.
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
async-channel = "2"
futures-util = "0.3"
rand = "0.9"

[dev-dependencies]
tempfile = "3"
