[package]
name = "campfe-core"
description = "UI-agnostic Basecamp logic for Campfe: API client, auth, models, cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tracing.workspace = true
thiserror.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
glib.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# The keyring: the Secret Service on the desktop, the Secret portal in a sandbox.
oo7 = { version = "0.6", default-features = false, features = ["tokio", "native_crypto"] }
regex = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
